<div class="cumple-container">
  <div class="particles">
    <div
      *ngFor="let particle of particles"
      class="particle"
      [style.left.%]="particle.left"
      [style.animation-delay.s]="particle.delay"
    >
      {{ getParticleEmoji() }}
    </div>
  </div>

  <div class="content">
    <h1 class="title">¡FELIZ CUMPLEAÑOS! 🎉</h1>

    <div class="message">
      <p>Hoy es un día especial para celebrar...</p>
      <p class="highlight">¡Que disfrutes cada momento!</p>
    </div>

    <div class="balloon-container">
      <div class="balloon red"></div>
      <div class="balloon blue"></div>
      <div class="balloon yellow"></div>
      <div class="balloon green"></div>
      <div class="balloon purple"></div>
    </div>

    <div class="celebration-text">
      <p>🎂 Que todos tus deseos se hagan realidad 🎂</p>
      <p class="emoji-line">🌟 ✨ 🎊 ✨ 🌟</p>
    </div>
  </div>
</div>
